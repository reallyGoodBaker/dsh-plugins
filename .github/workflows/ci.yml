name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # The plugin drives the Windows-only NetEase ModPC client; unit tests are
    # platform-independent but the repo is developed and verified on Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check (all plugins)
        shell: pwsh
        run: |
          $failed = 0
          Get-ChildItem -Recurse -File -Include *.js,*.mjs | Where-Object { $_.FullName -notmatch 'node_modules' } | ForEach-Object {
            node --check $_.FullName 2>&1 | Out-Null
            if ($LASTEXITCODE -ne 0) { Write-Host "FAIL $($_.FullName)"; $failed += 1 }
          }
          if ($failed -gt 0) { exit 1 }
      - name: dsh-mcdev unit tests
        shell: pwsh
        working-directory: dsh-mcdev
        run: |
          $scripts = @(
            'scripts/test-host.mjs',
            'scripts/test-native-util.mjs',
            'scripts/test-native-channel.mjs',
            'scripts/test-client-shapes.mjs',
            'scripts/test-locale-parity.mjs',
            'scripts/test-docs-search.mjs',
            'scripts/test-presets.mjs',
            'scripts/test-catalog.mjs'
          )
          foreach ($script in $scripts) {
            Write-Host "== $script =="
            node $script
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          # scripts/test-integration.mjs needs an installed NetEase ModPC client and
          # is run manually on a dev machine; it is not part of CI.
